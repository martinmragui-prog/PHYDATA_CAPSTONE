name: Deploy CRISP-DM slides

on:
  push:
    branches:
      - main
    paths:
      - slides.html
      - figures/**
      - .github/workflows/deploy-slides.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare presentation site
        run: |
          mkdir -p _site/figures
          cp slides.html _site/index.html
          cp figures/*.png _site/figures/

      - name: Upload presentation site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy presentation site
        id: deployment
        uses: actions/deploy-pages@v4
