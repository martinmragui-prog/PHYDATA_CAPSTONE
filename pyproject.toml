[project]
name = "capstone-martin"
version = "0.1.0"
description = "Prepare World Bank agriculture and income data for analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "matplotlib>=3.11.2",
    "pandas>=2.2",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "streamlit>=1.50",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
